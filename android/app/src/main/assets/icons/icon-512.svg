<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="zenLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B9E54C" />
      <stop offset="100%" stop-color="#6F9A23" />
    </linearGradient>
    <filter id="zenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#B9E54C" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Background with Apple-style squircle corners -->
  <rect width="512" height="512" rx="112" fill="#0B0D0B"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#24291D" stroke-width="8"/>
  
  <!-- Subtle Outer Orbit Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#F5F7EF" stroke-opacity="0.12" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Circadian Upper Arc (Dynamic biological cycle) -->
  <path d="M 128,256 A 128,128 0 0,1 384,256" fill="none" stroke="url(#zenLogoGrad)" stroke-width="26" stroke-linecap="round" filter="url(#zenGlow)"/>
  
  <!-- Central Zen Harmonic Wave -->
  <path d="M 170,265 C 200,215 220,215 256,265 C 292,315 312,315 342,265" fill="none" stroke="url(#zenLogoGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Zenith Energy / Focus Node -->
  <circle cx="256" cy="128" r="22" fill="#B9E54C" filter="url(#zenGlow)"/>
  <circle cx="256" cy="128" r="9" fill="#FFFFFF"/>
</svg>
