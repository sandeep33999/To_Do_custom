<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#818cf8" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 8"/>
  
  <!-- Dynamic Time Arc (representing dynamic schedule) -->
  <path d="M 256,96 A 160,160 0 1,1 142.8,369.2" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round" filter="url(#shadow)"/>
  
  <!-- Pulse Node on the track -->
  <circle cx="256" cy="96" r="16" fill="#38bdf8" filter="url(#shadow)"/>
  <circle cx="256" cy="96" r="8" fill="#ffffff"/>
  
  <!-- Clock hands with lightning/dynamic bolt motif -->
  <circle cx="256" cy="256" r="28" fill="#1e1b4b" stroke="url(#accent)" stroke-width="6"/>
  <path d="M 256,256 L 256,160" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
  <path d="M 256,256 L 330,285" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="10" fill="#38bdf8"/>
  
  <!-- Dynamic forward ripple arrows -->
  <path d="M 360,180 L 390,210 L 360,240" fill="none" stroke="#c084fc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M 385,180 L 415,210 L 385,240" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
